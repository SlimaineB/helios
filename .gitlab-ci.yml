# Helios CI/CD: tests -> container images -> Helm charts.
#
# Produces, in GitLab's own hosting:
#   - container images : $CI_REGISTRY_IMAGE/server and .../agent
#   - helm repo        : helm repo add <name> $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/helm/stable
#
# Helm install example:
#   helm install hub <name>/helios-server --set image.repository=$CI_REGISTRY_IMAGE/server
#   helm install agt <name>/helios-agent --set image.repository=$CI_REGISTRY_IMAGE/agent \
#     --set config.server=http://hub-<name>-helios-server --set config.token=<token>
#
# Runner: any docker/podman executor works; no privileged/Docker socket needed.

stages:
  - test
  - build
  - release

variables:
  IMAGE_SERVER: $CI_REGISTRY_IMAGE/server
  IMAGE_AGENT: $CI_REGISTRY_IMAGE/agent

# ------------------------------------------------------------------ tests ---

test:go-server:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd server
    - go vet ./...
    - go test ./...

test:go-agent:
  stage: test
  image: golang:1.25-alpine
  script:
    - cd agent
    - go vet ./...
    - go test ./...

test:ui:
  stage: test
  image: node:20-alpine
  script:
    - cd ui
    - npm ci
    - npm run build

.helm-cli:
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl tar ca-certificates
    - curl -fsSL https://get.helm.sh/helm-v3.18.0-linux-amd64.tar.gz -o /tmp/helm.tgz
    - tar -C /usr/local/bin -xzf /tmp/helm.tgz --strip-components=1 linux-amd64/helm

test:helm:
  extends: .helm-cli
  stage: test
  script:
    - helm lint helm/helios-server helm/helios-agent --set config.token=ci-test-token
    - helm template s helm/helios-server >/dev/null
    - helm template a helm/helios-agent --set config.token=ci-test-token >/dev/null

test:shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -S warning deploy/install.sh deploy/install-agent.sh deploy/install-server.sh hack/smoke.sh hack/looptest.sh hack/agent-entrypoint.sh

# ------------------------------------------------------------------ build ---

# Classic GitLab Docker-in-Docker + buildx. Requires a privileged executor
# (GitLab.com shared runners are); this is the supported, actively-maintained
# path. Two-stage cache: <image>:cache is the buildx cache ref.
# The charts default to `image.repository: helios/<name>`; point them at
# the registry of your project (see header) with --set image.repository/tag.
# Images: <sha> always, latest on the default branch, the tag name on tags.
.build-template:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: dind
  variables:
    DOCKER_HOST: tcp://dind:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

# BuildKit on the default `docker` buildx driver cannot export to a registry
# cache backend; `type=inline` keeps the cache inside the pushed image while
# the next run imports it back via its `latest` tag (first run: cache-miss,
# buildx ignores it).
.build-bake:
  script:
    - |
      tags="-t $IMAGE_SERVER:$CI_COMMIT_SHORT_SHA"
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && tags="$tags -t $IMAGE_SERVER:latest"
      [ -n "$CI_COMMIT_TAG" ] && tags="$tags -t $IMAGE_SERVER:$CI_COMMIT_TAG"
      # shellcheck disable=SC2086
      docker buildx build --push -f Dockerfile \
        --cache-from type=registry,ref=$IMAGE_SERVER:latest \
        --cache-to type=inline \
        $tags .

build:server:
  extends: [.build-template, .build-bake]

build:agent:
  extends: [.build-template, .build-bake]
  script:
    - |
      tags="-t $IMAGE_AGENT:$CI_COMMIT_SHORT_SHA"
      [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && tags="$tags -t $IMAGE_AGENT:latest"
      [ -n "$CI_COMMIT_TAG" ] && tags="$tags -t $IMAGE_AGENT:$CI_COMMIT_TAG"
      # shellcheck disable=SC2086
      docker buildx build --push -f agent/Dockerfile \
        --cache-from type=registry,ref=$IMAGE_AGENT:latest \
        --cache-to type=inline \
        $tags .

# Bare-metal installer: each linux binary (amd64 + arm64) and a full tarball
# (binaries + systemd unit + installer) are pushed to the Generic Package
# Registry. Installer usage:
#   sudo ./install-agent.sh --server https://hub.example.com --token <t> \
#     --binary-url \
#     "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/helios-agent/$VER/helios-agent-linux-amd64"
release:binary:
  stage: release
  image: golang:1.25-alpine
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - set -e
    - apk add --no-cache tar
    - VER=${CI_COMMIT_TAG#v}
    - mkdir -p dist/agent dist/release
    - cd agent && go mod download
    - |
      for a in amd64 arm64; do
        GOOS=linux GOARCH=$a CGO_ENABLED=0 go build -ldflags="-s -w" -o ../dist/agent/helios-agent-linux-$a ./cmd/agent
      done
    - cd ..
    - cp deploy/helios-agent.service deploy/install-agent.sh dist/agent/
    - tar -C dist/agent -czf dist/release/helios-agent-${VER}.tar.gz .
    # one upload per binary + the tarball
    - |
      for f in dist/agent/helios-agent-linux-*; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helios-agent/${VER}/$(basename "$f")"
      done
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "dist/release/helios-agent-${VER}.tar.gz" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/helios-agent/${VER}/helios-agent-${VER}.tar.gz"
  artifacts:
    paths:
      - dist/release/*.tar.gz
    expire_in: 1 year

# ---------------------------------------------------------------- release ---

# Packages both charts and publishes them to the GitLab Helm package repo
# (channel "stable"); GitLab auto-serves the index.yaml. Chart versions are
# bumped to the git tag on each release tag (v0.2.0 -> 0.2.0).
release:helm:
  stage: release
  extends: .helm-cli
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - set -e
    - VER=${CI_COMMIT_TAG#v}
    - 'sed -i "s/^version:.*/version: $VER/; s/^appVersion:.*/appVersion: \"$VER\"/" helm/helios-server/Chart.yaml helm/helios-agent/Chart.yaml'
    - helm lint helm/helios-server helm/helios-agent --set config.token=ci-test-token
    - mkdir -p dist && helm package --destination dist helm/helios-server helm/helios-agent
    - |
      for f in dist/*.tgz; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/stable/${f##*/}"
      done
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 30 days