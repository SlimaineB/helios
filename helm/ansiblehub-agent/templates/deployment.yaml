{{- if eq .Values.mode "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ansiblehub-agent.fullname" . }}
  labels:
    {{- include "ansiblehub-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ansiblehub-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    {{- include "ansiblehub-agent.pod" . | nindent 4 }}
{{- end }}