# Default values for helios-server.
# This is a YAML-formatted file.

# Multiple replicas require database.dsn (PostgreSQL). SQLite is single-writer.
# The chart refuses replicaCount > 1 with the default SQLite backend.
replicaCount: 1

image:
  repository: helios/server
  tag: latest
  pullPolicy: IfNotPresent

# Image built from the root Dockerfile (embeds the React UI + Go server).
# -addr and -db can be overridden/extra args appended via extraArgs.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Storage for the default SQLite database. Set database.dsn below to use
# PostgreSQL instead; the SQLite volume is then unused. Keep a real PVC/storageClass
# for SQLite so the database survives pod restarts.
storage:
  className: null    # null -> cluster default storage class
  size: 10Gi
  accessMode: ReadWriteOnce

# Public URL used for OIDC callbacks and secure cookies. When empty and ingress
# is enabled, the chart derives it from ingress.host and ingress.tls.
baseUrl: ""

ingress:
  enabled: false
  className: ""
  host: hub.example.com
  tls:
    enabled: false
    secretName: ""
    # hosts: [hub.example.com]

# Backend. Leave dsn empty for SQLite (default, backed by the /data PVC).
# Set a postgres:// URL to use Postgres instead (e.g. an external or a
# cloud-managed instance). The server chart ships no Postgres.
database:
  dsn: ""

# Drift healing policy. After `maxDriftStreak` consecutive apply→after-apply
# cycles that failed to converge, the assignment is flagged "stuck": the agent
# stops applying (drift checks continue) until the playbook converges again or
# an operator re-arms autoheal.
healing:
  maxDriftStreak: 3

# Tunnel (reverse SSH) mode. The runner API is disabled when no token
# is configured. The gateway is the SSH destination shown to operators, for
# example "helios-tunnel@bastion.example.com"; ports are allocated on the hub
# loopback from this range for each tunnel instance.
runner:
  token: ""
  # existingSecret: name of a Secret holding key `runner-token`.
  existingSecret: ""
  tunnelGateway: ""
  tunnelPortMin: 22000
  tunnelPortMax: 22999

# Per-replica repo snapshot cache. Agents download an immutable tarball for the
# resolved commit instead of cloning every repository from the git server.
# Each pod gets its own ephemeral emptyDir, so no shared PVC or RWX storage is
# required. A restart loses the cache and the replica simply refetches; agents
# fall back to git whenever the cache is cold or unavailable. Snapshots are
# capped by age and total size, and the emptyDir itself is bounded.
repoCache:
  enabled: false
  dir: /var/cache/helios/repos
  sizeLimit: 5Gi     # emptyDir size limit per pod; tune to the node disk
  ttl: 168h          # delete snapshots older than 7 days (0 disables)
  maxMB: 2048        # evict least-recently-used snapshots above 2 GiB (0 disables)
  resolveTTL: 30s    # reuse a branch resolution this long (0 = fetch every request)

# HTTP Basic auth protecting the operator UI + API. When password is empty and
# no existingSecret is set, the chart generates one and keeps it across upgrades.
operatorAuth:
  user: admin
  password: ""
  # existingSecret: name of a Secret holding key `operator-password`.
  # Allow an unauthenticated API/UI. Only for isolated lab environments.
  allowUnauthenticated: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}

extraArgs: []