{{- if and .Values.secretKey.value (not .Values.secretKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helios-server.secretKeySecret" . }}
  labels:
    {{- include "helios-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ .Values.secretKey.value | quote }}
{{- end }}
