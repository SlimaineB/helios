{{- if and .Values.operatorAuth.user (not .Values.operatorAuth.existingSecret) }}
{{- $secretName := include "helios-server.operatorSecret" . }}
{{- $password := .Values.operatorAuth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "operator-password") }}
{{- $password = index $existing.data "operator-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "helios-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  operator-password: {{ $password | quote }}
{{- end }}
