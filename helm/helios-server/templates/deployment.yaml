{{- if and (not .Values.operatorAuth.user) (not .Values.operatorAuth.allowUnauthenticated) }}
{{- fail "operatorAuth.user is required; set operatorAuth.allowUnauthenticated=true only for an isolated lab" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.database.dsn) }}
{{- fail "replicaCount > 1 requires database.dsn (PostgreSQL); SQLite is single-writer and cannot be shared by replicas" }}
{{- end }}
{{- $baseURL := .Values.baseUrl }}
{{- if and (not $baseURL) .Values.ingress.enabled }}
{{- $baseURL = printf "%s://%s" (ternary "https" "http" .Values.ingress.tls.enabled) .Values.ingress.host }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helios-server.fullname" . }}
  labels:
    {{- include "helios-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "helios-server.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "helios-server.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - -addr
            - :8080
            - -db
            - /data/helios.db
            - -ui
            - /app/ui
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          {{- if or .Values.database.dsn .Values.operatorAuth.user .Values.healing.maxDriftStreak $baseURL .Values.runner.token .Values.runner.existingSecret .Values.runner.tunnelGateway .Values.repoCache.enabled }}
          env:
            {{- if $baseURL }}
            - name: HELIOS_BASE_URL
              value: {{ $baseURL | quote }}
            {{- end }}
            {{- if .Values.database.dsn }}
            - name: HELIOS_DB
              value: {{ .Values.database.dsn | quote }}
            {{- end }}
            {{- if .Values.healing.maxDriftStreak }}
            - name: HELIOS_HEAL_MAX_STREAK
              value: {{ .Values.healing.maxDriftStreak | quote }}
            {{- end }}
            {{- if .Values.operatorAuth.user }}
            - name: HELIOS_OPERATOR_USER
              value: {{ .Values.operatorAuth.user | quote }}
            - name: HELIOS_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helios-server.operatorSecret" . }}
                  key: operator-password
            {{- end }}
            {{- if or .Values.runner.token .Values.runner.existingSecret }}
            - name: HELIOS_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "helios-server.runnerSecret" . }}
                  key: runner-token
            {{- end }}
            {{- if .Values.runner.tunnelGateway }}
            - name: HELIOS_TUNNEL_GATEWAY
              value: {{ .Values.runner.tunnelGateway | quote }}
            {{- end }}
            {{- if .Values.runner.tunnelPortMin }}
            - name: HELIOS_TUNNEL_PORT_MIN
              value: {{ .Values.runner.tunnelPortMin | quote }}
            {{- end }}
            {{- if .Values.runner.tunnelPortMax }}
            - name: HELIOS_TUNNEL_PORT_MAX
              value: {{ .Values.runner.tunnelPortMax | quote }}
            {{- end }}
            {{- if .Values.repoCache.enabled }}
            - name: HELIOS_REPO_CACHE_DIR
              value: {{ .Values.repoCache.dir | default "/var/cache/helios/repos" | quote }}
            - name: HELIOS_REPO_CACHE_TTL
              value: {{ .Values.repoCache.ttl | default "168h" | quote }}
            - name: HELIOS_REPO_CACHE_MAX_MB
              value: {{ .Values.repoCache.maxMB | default 2048 | quote }}
            - name: HELIOS_REPO_CACHE_RESOLVE_TTL
              value: {{ .Values.repoCache.resolveTTL | default "30s" | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if not .Values.database.dsn }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.repoCache.enabled }}
            - name: repo-cache
              mountPath: {{ .Values.repoCache.dir | default "/var/cache/helios/repos" }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.database.dsn }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "helios-server.fullname" . }}-data
        {{- end }}
        {{- if .Values.repoCache.enabled }}
        - name: repo-cache
          emptyDir:
            sizeLimit: {{ .Values.repoCache.sizeLimit | default "5Gi" }}
        {{- end }}