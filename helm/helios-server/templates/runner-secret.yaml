{{- if and .Values.runner.token (not .Values.runner.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helios-server.runnerSecret" . }}
  labels:
    {{- include "helios-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  runner-token: {{ .Values.runner.token | quote }}
{{- end }}
