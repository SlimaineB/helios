{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helios-agent.configSecret" . }}
  labels:
    {{- include "helios-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  agent.yaml: |
{{ include "helios-agent.configFile" . | indent 4 }}
{{- end }}