# Default values for helios-agent.
# The agent runs the registered playbooks against the filesystem of the pod it
# lives in: a Deployment manages a single agent, a DaemonSet reconciles every
# matching node (nodeSelector).

# mode: deployment (default) | daemonset
mode: deployment
replicaCount: 1

nodeSelector: {}
tolerations: []
affinity: {}

image:
  repository: helios/agent
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Agent configuration. token is required — set it per release, e.g.:
#   helm install agent-1 --set config.agentName=agent-1 \
#     --set config.token=xxx helm/helios-agent
# or provide an existing Secret holding a key `agent.yaml` (full config file):
#   --set existingConfigSecret=my-agent-config
config:
  # agentName is a free label; the canonical server-side identity comes from
  # instanceId when set, otherwise from EC2 metadata / stable local id.
  agentName: agent
  server: http://helios-server:80
  token: ""
  instanceId: ""         # empty -> auto-register (metadata or local id)
  stateDir: /var/lib/helios/agent
  pollInterval: 30s
  maxConcurrentApps: 4
  autoheal: true
  insecureSkipVerify: false
  ansibleBin: ansible-playbook

# Alternative to `config.token`: an existing Secret whose key is `agent.yaml`
# containing the full agent config file. When set, `config` block is ignored.
existingConfigSecret: ""

resources:
  {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

podAnnotations: {}

# Pod security context. Ansible pull-agents reconcile the host filesystem, so
# playbooks that manage users/packages need root (runAsUser: 0, runAsNonRoot:
# false). Default stays unprivileged for read-only checks.
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# If stateDir is ephemeral, use emptyDir. For persistent repo mirrors on a
# DaemonSet (node-local dir), provide a HostPath path here.
statePersistence:
  type: emptyDir        # emptyDir | hostPath | pvc
  hostPath: ""          # when type=hostPath
  pvcName: ""           # when type=pvc