{{- if .Values.operatorAuth.user }}{{- if not .Values.operatorAuth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansiblehub-server.fullname" . }}-operator
  labels:
    {{- include "ansiblehub-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  operator-password: {{ .Values.operatorAuth.password | quote }}
{{- end }}{{- end }}