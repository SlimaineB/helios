name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Push images and Helm charts to GHCR
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      - name: Test Go
        run: |
          (cd server && go vet ./... && go test ./...)
          (cd agent && go vet ./... && go test ./...)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test UI build
        run: |
          cd ui
          npm ci
          npm run build

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: Dockerfile
          - name: agent
            dockerfile: agent/Dockerfile
          - name: repo
            dockerfile: hack/repo-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' || inputs.publish
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${REGISTRY}/${owner}/helios-${{ matrix.name }}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' || inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Prepare charts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            image_tag="$version"
          else
            version="0.0.0-${GITHUB_SHA:0:7}"
            image_tag="sha-${GITHUB_SHA:0:7}"
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for chart in helios-server helios-agent; do
            sed -i \
              -e "s/^version:.*/version: ${version}/" \
              -e "s/^appVersion:.*/appVersion: \"${version}\"/" \
              -e "s|^  repository: .*|  repository: ${REGISTRY}/${owner}/${chart}|" \
              -e "s|^  tag: .*|  tag: ${image_tag}|" \
              "helm/${chart}/Chart.yaml" "helm/${chart}/values.yaml"
          done

      - name: Lint and package charts
        run: |
          helm lint helm/helios-server helm/helios-agent --set config.token=ci-test-token
          mkdir -p dist/charts
          helm package --destination dist/charts helm/helios-server helm/helios-agent

      - name: Log in to GHCR
        if: github.ref_type == 'tag' || inputs.publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "$REGISTRY" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push Helm charts
        if: github.ref_type == 'tag' || inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for chart in dist/charts/*.tgz; do
            helm push "$chart" "oci://${REGISTRY}/${owner}/charts"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: dist/charts/*.tgz
          if-no-files-found: error
          retention-days: 7

  baremetal:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build bare-metal packages
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA:0:7}"
          fi
          mkdir -p dist/release

          for arch in amd64 arm64; do
            mkdir -p "dist/agent-${arch}" "dist/server-${arch}" "dist/runner-${arch}"

            (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "../dist/agent-${arch}/helios-agent" ./cmd/agent)

            (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "../dist/runner-${arch}/helios-runner" ./cmd/runner)

            (cd server && CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "../dist/server-${arch}/helios-server" ./cmd/server)

            cp deploy/install-agent.sh deploy/helios-agent.service "dist/agent-${arch}/"
            cp deploy/install-server.sh deploy/helios-server.service "dist/server-${arch}/"
            cp deploy/helios-runner.service deploy/runner.env.example "dist/runner-${arch}/"
            cp -a ui/dist "dist/server-${arch}/ui"

            tar -C "dist/agent-${arch}" -czf \
              "dist/release/helios-agent-${VERSION}-linux-${arch}.tar.gz" .
            tar -C "dist/server-${arch}" -czf \
              "dist/release/helios-server-${VERSION}-linux-${arch}.tar.gz" .
            tar -C "dist/runner-${arch}" -czf \
              "dist/release/helios-runner-${VERSION}-linux-${arch}.tar.gz" .

            cp "dist/agent-${arch}/helios-agent" \
              "dist/release/helios-agent-linux-${arch}"
            cp "dist/runner-${arch}/helios-runner" \
              "dist/release/helios-runner-linux-${arch}"
            cp "dist/server-${arch}/helios-server" \
              "dist/release/helios-server-linux-${arch}"
          done

          install -m 0755 deploy/install.sh dist/release/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: baremetal-packages
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [baremetal, helm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baremetal-packages
          path: dist/release

      - uses: actions/download-artifact@v4
        with:
          name: helm-charts
          path: dist/charts

      - name: Generate checksums
        run: |
          cd dist/release
          sha256sum * > checksums.txt
          cd ../charts
          sha256sum * >> ../release/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Helios ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*
            dist/charts/*
