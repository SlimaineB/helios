---
# Helios demo application — richer variant.
#
# A more realistic ansible-pull workload: a "webapp" role driven by vars,
# with directories, a system user, a Jinja2 config template, a properties
# file edited with lineinfile, one listener conf per enabled feature, and a
# second play that verifies the deployment. All tasks are safe to run inside
# the docker-compose "agent" containers (no systemd, no privileged mounts).
#
# Drift demo: on an agent, overwrite /tmp/helios-demo/state.txt (or edit
# a value inside /tmp/helios-demo/conf/app.properties), wait for the next
# --check pass, then watch the UI flip to Drift and autoheal converge back.
- name: Provision Helios demo app
  hosts: localhost
  gather_facts: true
  become: false
  roles:
    - role: webapp
      vars:
        app_name: helios-demo
        app_env: staging
        release: v1.2.0
        ports: [8042, 8043]
        features:
          healthz:
            enabled: true
          metrics:
            enabled: true
            token: "change-me-token"
          pprof:
            enabled: false
  tasks:
    - name: Ensure the exposed state file holds the desired content
      ansible.builtin.copy:
        content: "desired-state-v1\n"
        dest: /tmp/helios-demo/state.txt
        mode: "0644"

- name: Verify the deployed application
  hosts: localhost
  gather_facts: true
  become: false
  tasks:
    - name: Probe the managed component files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /tmp/helios-demo/webapp.conf
        - /tmp/helios-demo/conf/app.properties
        - /tmp/helios-demo/conf/healthz.conf
        - /tmp/helios-demo/conf/metrics.conf
      register: probes

    - name: Report the environment being managed
      ansible.builtin.debug:
        msg: "managed by Helios — {{ ansible_hostname }} {{ ansible_distribution }}; component files present: {{ probes.results | map(attribute='stat.exists') | list }}"