---
# webapp role — manages the demo webapp deployment under /tmp/helios-demo.
- name: Ensure the base directory tree exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /tmp/helios-demo
    - /tmp/helios-demo/conf

- name: Ensure the service user exists
  ansible.builtin.user:
    name: svc-webapp
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Ship the main webapp config from a template
  ansible.builtin.template:
    src: webapp.conf.j2
    dest: /tmp/helios-demo/webapp.conf
    mode: "0644"

- name: Ensure the properties file carries the app identity
  ansible.builtin.lineinfile:
    path: /tmp/helios-demo/conf/app.properties
    regexp: '^app.name='
    line: 'app.name=helios-demo'
    create: true
    mode: "0644"
    state: present

- name: Ensure the properties file carries the environment
  ansible.builtin.lineinfile:
    path: /tmp/helios-demo/conf/app.properties
    regexp: '^app.environment='
    line: 'app.environment=staging'
    create: true
    state: present

- name: Enable the healthz flag in the properties file
  ansible.builtin.lineinfile:
    path: /tmp/helios-demo/conf/app.properties
    regexp: '^healthz='
    line: 'healthz=true'
    create: true
    state: present

- name: Enable the metrics flag in the properties file
  ansible.builtin.lineinfile:
    path: /tmp/helios-demo/conf/app.properties
    regexp: '^metrics='
    line: 'metrics=true'
    create: true
    state: present

- name: Render one listener config per enabled feature
  ansible.builtin.template:
    src: feature.conf.j2
    dest: "/tmp/helios-demo/conf/{{ item.key }}.conf"
    mode: "0644"
  loop: "{{ features | dict2items }}"
  when: item.value.enabled

- name: Install the systemd-style unit file
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=/usr/local/bin/helios-demo \
        --config /tmp/helios-demo/webapp.conf \
        --props /tmp/helios-demo/conf/app.properties
      Restart=on-failure
    dest: /tmp/helios-demo/helios-demo.service
    mode: "0644"