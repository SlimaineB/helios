# Production-oriented single-host hub. Agents are installed separately on the
# managed hosts (see docs/INSTALL.md).
#
#   cp .env.example .env && edit .env
#   docker compose up -d --build
#
# Optional Postgres:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
name: helios

services:
  server:
    image: ${HELIOS_IMAGE:-helios-server:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HELIOS_BIND_ADDR:-127.0.0.1}:${HELIOS_PORT:-8080}:8080"
    environment:
      HELIOS_OPERATOR_USER: ${HELIOS_OPERATOR_USER:-admin}
      HELIOS_OPERATOR_PASSWORD: ${HELIOS_OPERATOR_PASSWORD:-}
      HELIOS_BASE_URL: ${HELIOS_BASE_URL:-http://localhost:8080}
      HELIOS_DB: /data/helios.db
      HELIOS_RBAC_FILE: /etc/helios/rbac.yaml
      HELIOS_OIDC_ISSUER: ${HELIOS_OIDC_ISSUER:-}
      HELIOS_OIDC_CLIENT_ID: ${HELIOS_OIDC_CLIENT_ID:-}
      HELIOS_OIDC_CLIENT_SECRET: ${HELIOS_OIDC_CLIENT_SECRET:-}
      HELIOS_OIDC_GROUP_CLAIM: ${HELIOS_OIDC_GROUP_CLAIM:-groups}
      HELIOS_OIDC_SCOPES: ${HELIOS_OIDC_SCOPES:-openid, profile, email, groups}
      HELIOS_RUNNER_TOKEN: ${HELIOS_RUNNER_TOKEN:-}
      HELIOS_REPO_CACHE_DIR: /cache/repos
      HELIOS_REPO_CACHE_TTL: ${HELIOS_REPO_CACHE_TTL:-168h}
      HELIOS_REPO_CACHE_MAX_MB: ${HELIOS_REPO_CACHE_MAX_MB:-2048}
      HELIOS_REPO_CACHE_RESOLVE_TTL: ${HELIOS_REPO_CACHE_RESOLVE_TTL:-30s}
    volumes:
      - helios-data:/data
      - helios-repo-cache:/cache
      - ./rbac.yaml:/etc/helios/rbac.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

volumes:
  helios-data:
    name: helios-data
  helios-repo-cache:
    name: helios-repo-cache
