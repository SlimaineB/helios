# Production-oriented single-host hub. Agents are installed separately on the
# managed hosts (see docs/INSTALL.md).
#
#   cp .env.example .env && edit .env
#   docker compose up -d --build
#
# Optional Postgres:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
name: ansiblehub

services:
  server:
    image: ${ANH_IMAGE:-ansiblehub-server:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ANH_BIND_ADDR:-0.0.0.0}:${ANH_PORT:-8080}:8080"
    environment:
      ANSIBLEHUB_OPERATOR_USER: ${ANH_OPERATOR_USER:-admin}
      ANSIBLEHUB_OPERATOR_PASSWORD: ${ANH_OPERATOR_PASSWORD:?set ANH_OPERATOR_PASSWORD in .env}
      ANSIBLEHUB_BASE_URL: ${ANH_BASE_URL:-http://localhost:8080}
      ANSIBLEHUB_DB: /data/ansiblehub.db
    volumes:
      - ansiblehub-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

volumes:
  ansiblehub-data:
    name: ansiblehub-data
