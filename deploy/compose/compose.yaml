# Production-oriented single-host hub. Agents are installed separately on the
# managed hosts (see docs/INSTALL.md).
#
#   cp .env.example .env && edit .env
#   docker compose up -d --build
#
# Optional Postgres:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
name: helios

services:
  server:
    image: ${HELIOS_IMAGE:-${ANH_IMAGE:-${ANSIBLEHUB_IMAGE:-helios-server:local}}}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HELIOS_BIND_ADDR:-${ANH_BIND_ADDR:-${ANSIBLEHUB_BIND_ADDR:-127.0.0.1}}}:${HELIOS_PORT:-${ANH_PORT:-${ANSIBLEHUB_PORT:-8080}}}:8080"
    environment:
      HELIOS_OPERATOR_USER: ${HELIOS_OPERATOR_USER:-${ANH_OPERATOR_USER:-${ANSIBLEHUB_OPERATOR_USER:-admin}}}
      HELIOS_OPERATOR_PASSWORD: ${HELIOS_OPERATOR_PASSWORD:-${ANH_OPERATOR_PASSWORD:-${ANSIBLEHUB_OPERATOR_PASSWORD:-}}}
      HELIOS_BASE_URL: ${HELIOS_BASE_URL:-${ANH_BASE_URL:-${ANSIBLEHUB_BASE_URL:-http://localhost:8080}}}
      HELIOS_DB: /data/helios.db
      HELIOS_RUNNER_TOKEN: ${HELIOS_RUNNER_TOKEN:-}
      HELIOS_TUNNEL_GATEWAY: ${HELIOS_TUNNEL_GATEWAY:-}
      HELIOS_TUNNEL_PORT_MIN: ${HELIOS_TUNNEL_PORT_MIN:-22000}
      HELIOS_TUNNEL_PORT_MAX: ${HELIOS_TUNNEL_PORT_MAX:-22999}
    volumes:
      - helios-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

volumes:
  helios-data:
    name: helios-data
