# Optional PostgreSQL backend. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: ${HELIOS_POSTGRES_PASSWORD:-${ANH_POSTGRES_PASSWORD:-${ANSIBLEHUB_POSTGRES_PASSWORD:-}}}
      POSTGRES_DB: helios
    volumes:
      - helios-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    environment:
      HELIOS_DB: postgres://helios:${HELIOS_POSTGRES_PASSWORD:-${ANH_POSTGRES_PASSWORD:-${ANSIBLEHUB_POSTGRES_PASSWORD:-}}}@db:5432/helios?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  helios-postgres:
    name: helios-postgres
