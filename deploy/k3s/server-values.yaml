# helm values for the helios-server chart (helm/helios-server).
# Secrets are intentionally absent: pass the operator password on the CLI, or
# pre-create a Secret with key `operator-password` and set operatorAuth.existingSecret.
# >1 requires database.dsn (PostgreSQL); the chart rejects multiple replicas
# with the default SQLite PVC.
replicaCount: 1

image:
  repository: 192.168.1.21:30500/helios/server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer      # Cilium LB (L2 announcement) allocates 192.168.1.10x
  port: 80
  targetPort: 8080

# Backend: Postgres deployed with postgres.yaml (in-cluster ClusterIP). The
# server overrides its -db flag when HELIOS_DB is set. Keep the password
# out of git; pass the DSN at install time:
#   --set database.dsn="postgres://helios:$DB_PASSWORD@helios-db:5432/helios?sslmode=disable"
database:
  dsn: ""

# OIDC + RBAC lab setup. The Dex issuer uses the k3s node IP because it must be
# reachable from both the browser and the server pod; update it if the WSL IP
# changes. The browser callback stays on the forwarded Helios NodePort.
baseUrl: http://172.29.74.141:30080
oidc:
  enabled: true
  issuer: http://172.29.74.141:30557/dex
  clientId: helios
  existingSecret: helios-dex
  clientSecretKey: client-secret
  groupClaim: email
  scopes: "openid, profile, email, groups"
rbac:
  enabled: true
  existingConfigMap: helios-rbac
  key: rbac.yaml

# Stop applying after this many consecutive failed convergence cycles.
healing:
  maxDriftStreak: 3

# Operator Basic auth for the UI/API.
operatorAuth:
  user: admin
  # password: set via --set-string operatorAuth.password=<secret>
  # existingSecret: my-secret   # key `operator-password`

ingress:
  enabled: false

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}