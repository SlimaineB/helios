# In-cluster Docker registry (plain HTTP) exposed as a NodePort so the build
# host can `docker push 192.168.1.21:30500/...`. k3s nodes fetch through a
# containerd mirror with an HTTP endpoint (see registries.yaml.example), so
# no TLS is needed inside the LAN.
apiVersion: v1
kind: Namespace
metadata:
  name: helios
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: helios
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: helios
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500