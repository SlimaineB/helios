# helios Postgres backend. Replaces the SQLite file used by the plain
# (docker-compose / single-host) setups for a resettable, clustered state.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: helios-db-data
  namespace: helios
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-db
  namespace: helios
  labels:
    app: helios-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helios-db
  template:
    metadata:
      labels:
        app: helios-db
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: helios
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helios-db
                  key: password
            - name: POSTGRES_DB
              value: helios
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "helios", "-d", "helios"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "helios", "-d", "helios"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: helios-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: helios-db
  namespace: helios
spec:
  selector:
    app: helios-db
  ports:
    - port: 5432
      targetPort: 5432