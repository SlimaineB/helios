# RBAC for the Dex example users.
#
# Dex's local password connector does not emit a "groups" claim, so the server
# uses HELIOS_OIDC_GROUP_CLAIM=email for this lab. With a real provider
# (Okta/Keycloak) keep GROUP_CLAIM=groups and bind the actual groups instead:
#   - "g, helios:admins, role:admins"
#   - "g, helios:readers, role:readers"
policies:
  - "p, role:admins, *, *, *"
  - "p, role:readers, *, get, *"
bindings:
  - "g, admin@example.com, role:admins"
  - "g, reader@example.com, role:readers"
