# LAB ONLY. The static users/hashes below are deliberate test fixtures
# (admin123 / reader123). Never reuse this configuration in production.
issuer: http://localhost:5556

storage:
  type: memory

web:
  http: 0.0.0.0:5556

logger:
  level: debug

expiry:
  idTokens: 5m
  authRequests: 5m

oauth2:
  responseTypes: ["code"]

staticClients:
  - id: helios
    name: Helios
    secretEnv: HELIOS_DEX_CLIENT_SECRET
    redirectURIs:
      - http://localhost:8080/api/v1/auth/callback

enablePasswordDB: true
